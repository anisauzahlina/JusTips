<style>

h3{font-size:18px;margin:26px 0 14px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 5px #0002;overflow:hidden;cursor:pointer}.ph{background:var(--ph);height:150px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;position:relative;color:#222}

.tile{background:var(--card);border-radius:12px;box-shadow:0 1px 5px #0002;overflow:hidden}.tile .ph{height:130px}.tile .cb{gap:8px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:var(--o);color:#222;font-size:11px;font-weight:600}.pill.g1{background:#bdf3c6}.pill.r1{background:#f5b7b1}
.o{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #0002;display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.n{display:flex;justify-content:space-between;gap:10px;background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;border-left:4px solid var(--ln)}.n.u{border-color:var(--t)}
.ch{display:grid;grid-template-columns:280px 1fr;gap:16px;height:calc(100vh - 200px);min-height:420px}.cl,.ct{background:var(--card);border-radius:12px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.ci{padding:10px;border-radius:8px;cursor:pointer}.ci:hover,.ci.on{background:var(--bg)}.m{max-width:75%;padding:9px 12px;border-radius:12px;background:var(--bg);align-self:flex-start}.m.me{background:var(--t);color:#111;align-self:flex-end}
.sum{position:sticky;top:90px}.ln{display:flex;justify-content:space-between;padding:5px 0}.tot{font-weight:700;font-size:18px;border-top:1px solid var(--ln);margin-top:8px;padding-top:10px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.st div{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 1px 5px #0002}.st b{font-size:26px;display:block}
.sf{display:flex;gap:6px;margin:12px 0}.stp{display:flex;align-items:center;gap:8px}.stp button{width:28px;height:28px;border-radius:6px;border:1px solid var(--ln);background:var(--card);color:var(--ink);cursor:pointer}
details{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px}summary{font-weight:600;cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.s{opacity:1}
body{line-height:1.55}.steps div{display:flex;flex-direction:column;gap:6px;padding:22px}.steps p{margin:0;line-height:1.5;font-size:13px}.sn{font-size:30px;font-weight:700;opacity:.6;line-height:1}.steps b{font-size:16px}.eb{display:block;color:#fff;letter-spacing:.12em;font-weight:600;font-size:11px;margin:6px 0}.hero p{margin:10px 0}.fl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}.fl span{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font-size:12px}.o{gap:18px}.o>div:first-child{line-height:1.7}.ac{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}.ac .two{flex-basis:100%;margin-bottom:2px}.ac .btn{padding:11px 20px}.ac small{line-height:1.5}.bn{display:none}.lnk{color:var(--b);cursor:pointer;font-weight:600}.back{cursor:pointer;display:inline-flex;gap:6px;align-items:center;margin-bottom:14px;font-weight:600}
@media(max-width:760px){header{flex-wrap:wrap;padding:12px 16px;gap:10px}.sb{order:3;flex-basis:100%}.ic{margin-left:auto}.hm{display:none}main{padding:18px 16px 96px}.side{width:100%;flex-direction:row;flex-wrap:wrap}.side .btn{flex:1}
.g{grid-template-columns:repeat(2,1fr);gap:12px}.ph{height:110px}.hero{padding:22px}.hero h1,.hero h2{font-size:23px}.steps,.st{grid-template-columns:1fr}.two{grid-template-columns:1fr}
.ch{grid-template-columns:1fr;height:calc(100vh - 230px)}.ch.th .cl{display:none}.ch:not(.th) .ct{display:none}.sum{position:static}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:linear-gradient(90deg,#25E4D2,#2485A8);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:6;justify-content:space-around}
.bn button{background:none;border:0;color:#111;display:flex;flex-direction:column;align-items:center;font:600 10px Inter;gap:2px;position:relative}.bn .on{color:#fff}.ah{margin-left:auto}}

V.masuk=()=>pub()+`<main><div class="row"><div class="hero grow"><h2>Titipan berikutnya dimulai di sini.</h2><p>Belum bergabung?<br>Buat akun pembeli atau vendor Indonesia di luar negeri.</p><button class="btn b" onclick="go('daftar')">Daftar akun baru</button></div><div class="box grow"><h2>Masuk</h2><small>Selamat datang kembali. Lanjutkan perjalanan titip Anda.</small>${tabs()}<label>Email atau username</label><input id="em" placeholder="nama@email.com"><label>Password</label><input id="pw" type="password" placeholder="••••••••"><label class="chk"><input type="checkbox"> Ingat saya</label><div class="err" id="er"></div><p class="lnk" style="text-align:center" onclick="toast('Tautan reset password dikirim ke email Anda')">Lupa password?</p><button class="btn b w" onclick="login()">Masuk</button><p><small>Dengan masuk, Anda menyetujui Syarat Penggunaan dan Kebijakan Privasi.</small></p><p><small>Demo — pembeli: <b>raniputri</b>, vendor: <b>titiptokyo</b> · password: <b>password123</b></small></p></div></div><p><small>JusTips · Jastip lintas negara untuk Indonesia · <span class="lnk" onclick="go('bantuan')">Pusat Bantuan</span></small></p></main>`;
function login(){if(!$('em').value||$('pw').value.length<4){$('er').textContent='Isi email/username dan password.';return}S.role=S.tab=='Vendor'?'vendor':'buyer';go(B()?'beranda':'dasbor')}
V.daftar=()=>pub()+`<main><div class="row"><div class="hero grow"><h2>Dari sana, untuk Anda.</h2><b>Belanja lintas negara.<br>Atau buka jasa titip Anda.</b><p><small style="color:#fff">Jepang · Korea · Tiongkok · Thailand · Singapura</small></p><p><small style="color:#fff">Khusus pengguna Indonesia berusia 17 tahun ke atas.</small></p></div><div class="box grow"><h2>Daftar</h2><small>Satu akun untuk belanja atau membuka jasa titip. Minimal usia 17 tahun.</small>${tabs()}<div class="two"><div><label>Nama lengkap</label><input id="rn" placeholder="Sesuai identitas"></div><div><label>Username</label><input id="ru" placeholder="Pilih username"></div><div><label>Email</label><input id="re" placeholder="nama@email.com"></div><div><label>Nomor telepon</label><input id="rp" placeholder="+62"></div></div>${S.tab=='Vendor'?`<label>Negara domisili</label><select id="rk">${Object.keys(CN).map(c=>`<option>${c}</option>`).join('')}</select><label>Jenis barang yang dititipkan</label><input id="rc" placeholder="mis. Pakaian, Skincare">`:''}<label>Tanggal lahir</label><input id="dob" type="date"><small>Wajib berusia 17+ pada tanggal pendaftaran. Jika belum 17 tahun, pendaftaran ditolak.</small><label>Password</label><input id="pw" type="password" placeholder="Minimal 8 karakter"><label class="chk"><input id="c1" type="checkbox"> Saya berusia minimal 17 tahun.</label><label class="chk"><input id="c2" type="checkbox"> Saya menyetujui Syarat dan Kebijakan Privasi.</label><div class="err" id="er"></div><button class="btn b w" onclick="reg()">Buat akun ${S.tab.toLowerCase()}</button><p>Sudah punya akun? <span class="lnk" onclick="go('masuk')">Masuk</span></p></div></div></main>`;
function reg(){const d=new Date($('dob').value),n=new Date(),a=n.getFullYear()-d.getFullYear()-((n.getMonth()<d.getMonth()||(n.getMonth()==d.getMonth()&&n.getDate()<d.getDate()))?1:0),E=m=>$('er').textContent=m;
if(!$('dob').value)return E('Isi tanggal lahir.');if(a<17)return E('Pendaftaran ditolak: usia minimal 17 tahun.');if($('pw').value.length<8)return E('Password minimal 8 karakter.');if(!$('c1').checked||!$('c2').checked)return E('Centang kedua persetujuan.');S.role=S.tab=='Vendor'?'vendor':'buyer';toast('Akun berhasil dibuat');go(B()?'beranda':'dasbor')}
V.beranda=()=>`<div class="row"><div class="hero grow"><h1>Mau titip dari mana hari ini?</h1><small style="color:#fff">Barang pilihan. Vendor Indonesia. Lebih dekat.</small></div><div class="side"><button class="btn" onclick="go('negara')">Jelajahi Negara</button><button class="btn b" onclick="go('kategori')">Kategori Produk</button><button class="btn" onclick="go('vendor-list')">Daftar Vendor</button></div></div><h3>Barang yang mungkin anda sukai</h3>${grid(PD)}`;
V.negara=()=>back('beranda')+`<div class="g" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${Object.keys(CN).map(c=>`<div class="tile"><div class="ph">FOTO ${c.toUpperCase()}</div><div class="cb"><b>${c}</b><small>${CN[c]}</small><button class="btn l" onclick="S.sel.k='${c}';go('negara-detail')">Lihat produk</button></div></div>`).join('')}</div>`;
V['negara-detail']=()=>back('negara')+hero(S.sel.k,`Yuk, pilih barang berkualitas dari ${S.sel.k}!`)+`<h3>Barang yang mungkin anda sukai</h3>${grid(PD.filter(p=>p.k==S.sel.k))}`;
V.kategori=()=>back('beranda')+`<div class="g" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${CT.map(c=>`<div class="tile"><div class="ph">FOTO ${c.toUpperCase()}</div><div class="cb"><button class="btn l" onclick="S.sel.cat='${c}';go('kategori-detail')">${c}</button></div></div>`).join('')}</div>`;
V['kategori-detail']=()=>back('kategori')+hero(S.sel.cat)+`<h3>Produk</h3>${grid(PD.filter(p=>p.cat==S.sel.cat))}`;
V['vendor-list']=()=>{const k=S.ft.vk||'',c=S.ft.vc||'',L=VD.filter(v=>(!k||v.k==k)&&(!c||v.cat.includes({Clothing:'Pakaian',Accessories:'Aksesoris',Furniture:'Perabotan'}[c]||c)));return back('beranda')+`<div class="two" style="max-width:520px"><div><label>Negara</label><select onchange="S.ft.vk=this.value;render()"><option value="">Semua negara</option>${Object.keys(CN).map(x=>`<option ${k==x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Kategori</label><select onchange="S.ft.vc=this.value;render()"><option value="">Semua kategori</option>${CT.map(x=>`<option ${c==x?'selected':''}>${x}</option>`).join('')}</select></div></div><h3>${L.length} vendor Indonesia tersedia</h3><div class="g" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${L.map(v=>`<div class="card" onclick="S.sel.vid='${v.id}';S.vt='Barang';go('vendor-profil')"><div class="cb"><b>${v.n}</b><small>${v.c}, ${v.k} · WNI</small><small>★ ${v.r} · ${v.o} pesanan selesai</small><small>${v.cat}</small><span class="lnk">Lihat profil vendor →</span></div></div>`).join('')}</div>`};
V['vendor-profil']=()=>{const v=vd(S.sel.vid),t=S.vt||'Barang';return back('vendor-list')+`<div class="box"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px"><div><h2>${v.n}</h2><small>Vendor Indonesia · ${v.c}, ${v.k}</small><p>★ ${v.r} / 5 · ${v.o} pesanan selesai · Bergabung 2024<br>Menerima ${v.cat}. Estimasi pengiriman 7–14 hari setelah barang dibeli.</p></div><div style="display:flex;gap:10px;align-items:flex-start"><button class="btn" onclick="chatV('${v.id}')">Hubungi vendor</button><button class="btn b" onclick="chatV('${v.id}',1)">Ajukan titipan</button></div></div></div><div class="tabs" style="max-width:320px">${['Barang','Ulasan'].map(x=>`<button class="btn ${t==x?'on':''}" onclick="S.vt='${x}';render()">${x}</button>`).join('')}</div>`+(t=='Barang'?`<h3>Barang dari vendor ini</h3>${grid(PD.filter(p=>p.v==v.id))}`:`<h3>Ulasan pembeli</h3><div class="g" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))"><div class="box">★ 5 / 5 · Rani, Jakarta<br>“Komunikasi jelas dan barang sesuai pesanan.”</div><div class="box">★ 4 / 5 · Dimas, Bandung<br>“Dikemas rapi, waktu kirim sesuai estimasi.”</div></div>`)};
function chatV(id,ask){S.chats[id]=S.chats[id]||[];if(ask)S.chats[id].push({f:'b',t:'Halo, saya ingin mengajukan titipan barang. Boleh dibantu?',h:tm()});S.sel.chat=id;go('chat')}
V.cari=()=>{const t=S.ft,q=(S.q||'').toLowerCase();let L=PD.filter(p=>(!q||p.n.toLowerCase().includes(q)||vd(p.v).n.toLowerCase().includes(q))&&(!t.k||p.k==t.k)&&(!t.c||p.cat==t.c)&&p.p>=(t.mn||0)&&p.p<=(t.mx||1e12));if(t.s=='Harga terendah')L.sort((a,b)=>a.p-b.p);if(t.s=='Rating tertinggi')L.sort((a,b)=>b.r-a.r);
return`<h2>Hasil Pencarian</h2><p>Hasil untuk “${e(S.q||'semua barang')}” · ${L.length} barang ditemukan.</p><div class="row"><div class="box" style="width:240px;flex:none"><b>Filter</b><label>Negara</label><select id="fk"><option value="">Semua negara</option>${Object.keys(CN).map(x=>`<option ${t.k==x?'selected':''}>${x}</option>`).join('')}</select><label>Kategori</label><select id="fc"><option value="">Semua kategori</option>${CT.map(x=>`<option ${t.c==x?'selected':''}>${x}</option>`).join('')}</select><label>Harga minimum</label><input id="fmn" type="number" placeholder="Rp0" value="${t.mn||''}"><label>Harga maksimum</label><input id="fmx" type="number" placeholder="Tanpa batas" value="${t.mx||''}"><label>Urutkan</label><select id="fs">${['Paling relevan','Harga terendah','Rating tertinggi'].map(x=>`<option ${t.s==x?'selected':''}>${x}</option>`).join('')}</select><br><br><button class="btn b w" onclick="S.ft={k:$('fk').value,c:$('fc').value,mn:+$('fmn').value,mx:+$('fmx').value,s:$('fs').value};render()">Terapkan filter</button></div><div class="grow"><small>${L.length} hasil · Harga belum termasuk jasa dan ongkir</small><br><br>${grid(L)}</div></div>`};
V.produk=()=>{const p=pr(S.sel.pid),v=vd(p.v),sub=(p.p+p.j)*S.qty;return back('beranda')+`<div class="row"><div class="grow"><div class="ph" style="height:340px;border-radius:14px">${p.img?`<img src="${p.img}" alt="">`:'FOTO PRODUK'}</div></div><div class="grow"><small>${p.k.toUpperCase()} / ${p.cat.toUpperCase()}</small><h2 style="margin:6px 0">${e(p.n)} <button class="hb ${S.fav.has(p.id)?'on':''}" style="position:static;display:inline-block;vertical-align:middle" onclick="fav(${p.id})">${ic('heart')}</button></h2><small>★ ${p.r} · ${p.rv} ulasan · Tersedia</small><div class="pr" style="font-size:26px">Rp${f(p.p)}</div><small>Harga jasa Rp${f(p.j)}</small><p>Barang kebutuhan sehari-hari. Negara asal: ${p.k}. Lokasi vendor: ${p.c}, ${p.k}.</p><div class="box"><b>${v.n}</b><br><small>${v.c}, ${v.k} · ★ ${v.r} · ${v.o} pesanan selesai</small><br><span class="lnk" onclick="S.sel.vid='${v.id}';S.vt='Barang';go('vendor-profil')">Lihat profil vendor →</span></div></div><div class="box sum" style="width:300px;flex:none"><h3 style="margin:0 0 8px">Ringkasan pembelian</h3><label>Pilihan warna</label><select id="col"><option>Natural</option><option>Hitam</option><option>Putih</option></select><label>Jumlah barang</label><div class="stp"><button onclick="S.qty=Math.max(1,S.qty-1);render()">−</button><b>${S.qty}</b><button onclick="S.qty++;render()">+</button></div><div class="ln"><span>Harga barang</span><b>Rp${f(p.p*S.qty)}</b></div><div class="ln"><span>Harga jasa</span><b>Rp${f(p.j*S.qty)}</b></div><div class="ln"><span>Subtotal</span><b>Rp${f(sub)}</b></div><div class="ln"><span>Estimasi ongkir</span><b>Rp45.000</b></div><div class="ln"><span>Biaya impor</span><b>Dikonfirmasi vendor</b></div><div class="ln tot"><span>Estimasi total</span><span>Rp${f(sub+45000)}</span></div><small>Belum termasuk biaya impor jika dikenakan.</small><br><br><button class="btn b w" onclick="ajukan([{pid:${p.id},q:S.qty}],$('col').value)">Ajukan pembelian</button><br><br><button class="btn w" onclick="act('cartAdd',{pid:${p.id},q:S.qty}).then(()=>toast('Masuk keranjang'))">+ Keranjang</button><br><br><button class="btn l w" onclick="chatV('${v.id}')">Hubungi vendor</button><p><small>Pembayaran tersedia setelah pengajuan diterima dan penawaran dikirim.<br>Estimasi tiba 7–14 hari. Harga & ketersediaan dikonfirmasi vendor sebelum dibeli.</small></p></div></div>`};
function ajukan(items,col){items.forEach(i=>{const p=pr(i.pid),id='AJ-'+String(S.oc+++1).padStart(3,'0');S.orders.unshift({id,pid:i.pid,q:i.q,v:p.v,st:'menunggu',ong:45000,col:col||'Natural',resi:''});if(p.v==ME)notify('v','Pengajuan baru '+id,`Rani Putri mengajukan ${p.n} (${i.q}x).`,'dasbor','Tinjau pengajuan')});S.cart=S.cart.filter(c=>!items.some(i=>i.pid==c.pid));toast('Pengajuan terkirim ke vendor');S.otab='Semua';go('pesanan')}
V.keranjang=()=>{const L=S.cart,sel=L.filter(c=>c.on),it=sel.reduce((a,c)=>a+pr(c.pid).p*c.q,0),js=sel.reduce((a,c)=>a+pr(c.pid).j*c.q,0),og=sel.length?45000*new Set(sel.map(c=>pr(c.pid).v)).size:0;
return`<h2>Keranjang</h2>`+(L.length?`<div class="row"><div class="grow">${L.map((c,i)=>{const p=pr(c.pid),v=vd(p.v);return`<div class="o"><label class="chk" style="margin:0"><input type="checkbox" ${c.on?'checked':''} onchange="cartSet(${i},'on',this.checked)"><span><b>${v.n}</b><br><small>${v.c}, ${v.k} · ★ ${v.r}</small><br>${e(p.n)}<br><small>Jasa Rp${f(p.j)} / barang</small></span></label><div><div class="stp"><button onclick="cartSet(${i},'q',Math.max(1,S.cart[${i}].q-1))">−</button><b>${c.q}</b><button onclick="cartSet(${i},'q',S.cart[${i}].q+1)">+</button></div><b>Rp${f(p.p)}</b><br><span class="lnk" onclick="cartSet(${i},'del')">Hapus</span></div></div>`}).join('')}</div><div class="box sum" style="width:300px;flex:none"><h3 style="margin:0">Ringkasan</h3><div class="ln"><span>Harga barang (${sel.length})</span><b>Rp${f(it)}</b></div><div class="ln"><span>Total jasa</span><b>Rp${f(js)}</b></div><div class="ln"><span>Estimasi ongkir</span><b>Rp${f(og)}</b></div><div class="ln tot"><span>Estimasi total</span><span>Rp${f(it+js+og)}</span></div><small>Tiap vendor menjadi satu pengajuan terpisah. Harga final dan biaya impor dikonfirmasi vendor sebelum bayar.</small><br><br><button class="btn b w" ${sel.length?'':'disabled'} onclick="ajukan(S.cart.filter(c=>c.on))">Ajukan pembelian (${sel.length})</button><br><br><button class="btn l w" onclick="go('beranda')">Lanjut belanja</button></div></div>`:`<p>Keranjang kosong.</p><button class="btn" onclick="go('beranda')">Mulai belanja</button>`)};
const oc=(o,vend)=>{const p=pr(o.pid),v=vd(o.v),c=cost(o),pill=`<span class="pill ${o.st=='selesai'?'g1':o.st=='ditolak'?'r1':''}">${SL[o.st]}</span>`;let a='';
if(!vend){a=({menunggu:'<small>Menunggu keputusan vendor…</small>',diterima:`<button class="btn b" onclick="S.sel.oid='${o.id}';go('bayar')">Bayar Rp${f(c.tot)}</button>`,dikirim:`<button class="btn b" onclick="terima('${o.id}')">Pesanan diterima</button>`})[o.st]||'';a+=` <button class="btn l" onclick="chatV('${o.v}')">Hubungi vendor</button> <button class="btn l" onclick="go('bantuan')">Butuh bantuan?</button>`}
else a=({menunggu:`<button class="btn b" onclick="vtrm('${o.id}')">Terima</button> <button class="btn r" onclick="vtlk('${o.id}')">Tolak</button>`,diterima:'<small>Menunggu pembayaran pembeli</small>',dikemas:`<input id="rs${o.id}" placeholder="No. resi (mis. JNE123456)" style="width:200px"> <button class="btn b" onclick="kirim('${o.id}')">Kirim barang</button>`,dikirim:'<small>Dalam pengiriman · menunggu konfirmasi pembeli</small>'})[o.st]||'';
return`<div class="o"><div><b>#${o.id} · ${vend?e(o.bn||'Pembeli'):v.n}</b> ${pill}<br>${e(p.n)}<br><small>${o.col} · ${o.q} barang · ${p.c}, ${p.k} → Jakarta, Indonesia</small>${o.resi?`<br><small>Resi: <b>${e(o.resi)}</b></small>`:''}${stp(o)}${['dikemas','dikirim'].includes(o.st)?`<br><small>Estimasi tiba: 29 November – 6 Desember 2026</small>`:''}</div><div style="text-align:right"><small>${o.st=='menunggu'?'Anggaran':'Total'}</small><div class="pr" style="margin:0">Rp${f(vend&&o.st=='menunggu'?c.it:c.tot)}</div><div class="ac" style="justify-content:flex-end">${a}</div></div></div>`};
function terima(id){S.orders.find(o=>o.id==id).st='selesai';notify('v','Pesanan selesai #'+id,'Pembeli mengonfirmasi barang diterima.','v-pesanan','Lihat');toast('Terima kasih! Pesanan selesai');render()}
function vtrm(id){const o=S.orders.find(o=>o.id==id);o.ong=+$('og'+id).value||0;o.imp=+$('im'+id).value||0;o.st='diterima';notify('b','Penawaran baru dari vendor','Titip Tokyo mengirim rincian biaya untuk '+pr(o.pid).n+'. Silakan bayar.','pesanan','Lihat pesanan');(S.chats.v1=S.chats.v1||[]).push({f:'v',t:`Pengajuan #${id} diterima. Total Rp${f(cost(o).tot)} (termasuk ongkir). Silakan lanjut pembayaran.`,h:tm()});toast('Pengajuan diterima, penawaran dikirim');render()}
function vtlk(id){const o=S.orders.find(o=>o.id==id);o.st='ditolak';notify('b','Pengajuan ditolak','Maaf, vendor belum bisa memenuhi pengajuan #'+id,'pesanan','Lihat pesanan');toast('Pengajuan ditolak');render()}
function kirim(id){const r=$('rs'+id).value.trim();if(!r)return toast('Isi nomor resi dulu');const o=S.orders.find(o=>o.id==id);o.st='dikirim';o.resi=$('ks'+id).value+' · '+r;notify('b','Pesanan dikirim','#'+id+' dikirim dengan resi '+r+'.','pesanan','Lacak pesanan');toast('Status: Dikirim');render()}
V.pesanan=()=>{const T=['Semua','Belum Bayar','Dikemas','Dikirim','Selesai'],m={'Belum Bayar':'diterima'},L=S.orders.filter(o=>S.otab=='Semua'||(S.otab=='Dikemas'?['dikemas','siap'].includes(o.st):o.st==(m[S.otab]||S.otab.toLowerCase())));return`<h2>Pesanan Saya</h2><div class="sf" style="flex-wrap:wrap">${T.map(t=>`<button class="btn ${S.otab==t?'b':'l'}" onclick="S.otab='${t}';render()">${t}</button>`).join('')}</div>${L.map(o=>oc(o)).join('')||'<p>Belum ada pesanan.</p>'}`};
V.bayar=()=>{const o=S.orders.find(x=>x.id==S.sel.oid)||S.orders[0],p=pr(o.pid),c=cost(o);return back('pesanan','Kembali ke pesanan')+`<h2>Pembayaran</h2><small>Tinjau rincian, alamat, dan biaya impor sebelum mengonfirmasi.</small><div class="row" style="margin-top:14px"><div class="grow"><div class="box"><b>Pesanan #${o.id}</b><br>${e(p.n)} · ${o.col} · ${o.q} barang<br><small>${vd(o.v).n} · ${p.c}, ${p.k}</small><br><span class="pill g1">Pengajuan diterima · Penawaran dikonfirmasi</span></div><br><div class="box"><b>Alamat penerima</b><br>${e(S.me.nama)} · ${e(S.me.telp||'')}<br>${e(S.me.alamat||'Alamat belum diisi — ubah di Pengaturan')}<br><span class="lnk" onclick="go('pengaturan')">Ubah alamat</span></div><br><div class="box"><b>Metode pembayaran</b><br><label class="chk"><input type="radio" checked> PayPal</label><small>Informasi kartu tidak disimpan di JusTips. Pada transaksi nyata, Anda diarahkan ke PayPal. Nilai tukar final ditampilkan PayPal sebelum konfirmasi.</small></div></div><div class="box sum" style="width:320px;flex:none"><b>Rincian biaya</b><div class="ln"><span>Harga barang</span><span>Rp${f(c.it)}</span></div><div class="ln"><span>Harga jasa</span><span>Rp${f(c.js)}</span></div><div class="ln"><span>Estimasi ongkir</span><span>Rp${f(o.ong)}</span></div><div class="ln"><span>Biaya impor</span><span>Rp${f(o.imp||0)}</span></div><div class="ln tot"><span>Estimasi total</span><span>Rp${f(c.tot)}</span></div><label class="chk"><input id="ck" type="checkbox" onchange="$('pb').disabled=!this.checked"> Saya telah memeriksa rincian, alamat pengiriman, dan biaya impor Rp${f(o.imp||0)}.</label><button id="pb" class="btn b w" disabled onclick="bayar('${o.id}')">Bayar Rp${f(c.tot)} dengan PayPal</button><p><small>Simulasi pembayaran · Tanpa transaksi nyata</small></p></div></div>`};
function bayar(id){const o=S.orders.find(o=>o.id==id);o.st='dikemas';const t=f(cost(o).tot);notify('b','Pembayaran berhasil','PayPal mengonfirmasi Rp'+t+' untuk #'+id+'.','pesanan','Lihat pembayaran');notify('v','Pesanan masuk #'+id,'Rani Putri sudah membayar Rp'+t+'. Siapkan & kirim barang.','v-pesanan','Proses pesanan');S.otab='Dikemas';toast('Pembayaran berhasil');go('pesanan')}

function saveProf(){act('saveProf',{nama:$('pn').value,username:$('pu').value,telp:$('pt').value,email:$('pe').value,alamat:$('pa').value}).then(()=>toast('Perubahan disimpan')).catch(()=>0)}
if(TK)sync(true);setInterval(sync,5000);
